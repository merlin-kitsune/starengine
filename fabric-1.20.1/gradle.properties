# ---- Fabric 1.20.1 平台子项目属性 ----
# Minecraft
minecraft_version=1.20.1
# ⚠️ 2026-09-29 修正:Fabric Loader 的版本谓词**不支持 Maven 区间语法**
#    (VersionPredicateParser 只解析 = / > / >= / < / <= / ~ / ^ 与通配符,
#     没有 `[` `(` `)` 的处理 ⇒ 原来的 `[1.20.1]` 被当成「等于字面量 '[1.20.1]'」,
#     于是 HARD_DEP_INCOMPATIBLE_PRESELECTED:「需要 minecraft 的 [1.20.1] 版本,
#     但已经安装了的版本 1.20.1 不对」)。`~1.20.1` = `>=1.20.1 <1.21.0`,语义等价且合法。
minecraft_version_range=~1.20.1

# Fabric Loader / API
loader_version=0.19.5
fabric_version=0.92.12+1.20.1

# 前置/编译期依赖
# ⚠️ 钱包持久化改用 Fabric API 自带的 fabric-data-attachment-api-v1(随 fabric_version 来),
#    本库**不再把 CCA 列为运行前置**。
#    cca_version 保留只为 **编译期**:Trinkets 3.7.2 的 TrinketComponent 继承 CCA 的
#    ComponentV3,javac 解析 TrinketsApi 签名时必须能加载它(modCompileOnly)。
#    运行期 CCA 由 Trinkets 自己 hard-depends(其 fabric.mod.json)⇒ 玩家无需单独安装。
trinkets_version=3.7.2
cca_version=5.2.3

