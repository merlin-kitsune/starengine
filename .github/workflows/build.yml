name: Build

on:
  push:
    branches:
      - main
    tags:
      # 发布规范:tag 使用不含后缀的基础版本号(如 1.0.0),禁止 v 前缀与 +加载器后缀
      - '[0-9]*'
  pull_request:
  workflow_dispatch:
    inputs:
      cf_apply:
        description: '真正上传到 CurseForge(默认 false = 只 dry-run 验证接线;补传/重发时置 true)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21 (1.21.1 NeoForge)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup JDK 17 (1.20.1 Forge)
        # common/src/main/java 会被每个平台各编译一次,Java 17 侧用于强制
        # 「共享源码不得使用 Java 21 独有语法」这一约束,故 17 必须存在。
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup JDK 25 (26.1.2 NeoForge)
        # MC 26.1.2 的 javaVersion 主版本为 25(1.21.1 为 21),故第三个子项目的 toolchain 必须是 25。
        # 本步必须显式存在:根项目虽挂了 foojay 解析器(会自动下载缺失的 JDK),但 Gradle 守护进程
        # 跑在「最后一个 setup-java 的 JVM」上 —— 若 25 缺失,守护进程就是 17,与 26.1.2 的
        # ModDevGradle 不匹配;故 25 放在最末,使 JAVA_HOME = 25。
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (all platforms)
        # 产物清单(main 分支为三平台;fabric-1.20.1 分支另有 fabric 子项目):
        #           neoforge-1.21.1/build/libs  普通 jar(Mojmap,无需重映射)
        #           forge-1.20.1/build/libs     reobfJar(生产 SRG jar)
        #           neoforge-26.1.2/build/libs  普通 jar(Mojmap,无需重映射)
        # 说明:各平台 build **只产出 jar**,不触碰任何整合包目录
        # (2026-09-24 移除了 pushToPack —— 库存档不再被复制进整合包目录)。
        # ⚠️ 2026-10-01 政策:这些 jar **不挂到 GitHub Release**(见下方 Release 步骤)⇒ Release 只放源码归档;
        # ✅ 2026-11-10 起:jar 由本 workflow 末步上传到 CurseForge 项目 1755415(唯一商店渠道),四平台全发。
        # ⚠️ 失败时把**失败块**(`FAILURE: Build failed with an exception.` 起)提炼成 ::error 注解:
        #    job log 的下载接口需要仓库 admin 权限(403),而 check-run 的 annotations 端点
        #    **无需**凭据即可读(run 摘要页也直接可见)⇒ 把失败块搬进注解,CI 红了时不必先拿 token。
        #    注意取的是「FAILURE: 之后」而不是 tail:堆栈在最后,真正的 `* What went wrong` 在它之前。
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/gradle-build.log"
          if ./gradlew build --stacktrace 2>&1 | tee "$LOG"; then
            echo "Gradle build OK (all platforms)"
          else
            RC=$?
            DIAG=$(mktemp)
            {
              echo "=== FAILURE block ==="
              awk '/^FAILURE: Build failed/{f=1} f' "$LOG" | head -n 25
              echo "=== first error-ish lines ==="
              grep -m 10 -E "^> Task .*FAILED|error:|Could not resolve|Could not find|Caused by|A problem occurred|No matching toolchains|Unsupported class file" "$LOG" || true
            } > "$DIAG"
            ANSI=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' -e 's/%/%25/g' "$DIAG" \
                   | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-7000)
            echo "::error title=Gradle build failed (exit $RC)::${ANSI}"
            exit "$RC"
          fi

      - name: Read lib version
        id: version
        run: |
          VERSION=$(grep '^lib_version=' neoforge-1.21.1/gradle.properties | cut -d'=' -f2)
          BASE=${VERSION%%-*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # 守门:base 必须是裸 x.y.z,否则不打 tag
          if [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip_tag=0" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::base version '$BASE' is not a bare x.y.z — tag creation skipped"
            echo "skip_tag=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag (main push only, stable versions only)
        id: tag
        # 仅在 main 分支自动打 tag:tag = 基础版本号(去掉 -SNAPSHOT.x/-rc/-pre 与 +后缀),如 1.0.0。
        # 与消费方 astral_dice 的规则相比多一道守卫:版本号含 '-' 时(即快照版本)不打 tag
        # ——否则 push main 会因为 1.0.0-SNAPSHOT.1 而自动产出 tag "1.0.0",
        # 把尚未定型的快照误标为正式发布,且 tag 难以回收。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.skip_tag == '0'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Version $VERSION is a pre-release/snapshot (contains '-'), skip auto tagging"
            exit 0
          fi
          TAG="${{ steps.version.outputs.base }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
            CREATED=0
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            CREATED=1
          fi
          # 交给下一步发布 Release(同 job:tag 已保证存在)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # CurseForge 上传的幂等闸门:上传 API 没有「按版本号查重」接口,tag 新建=首次发布,
          # tag 已存在=该版本已发过(重跑不得叠重复文件)。
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

      - name: Create/Update GitHub Release (source code only — no JAR assets)
        # ⚠️ 2026-10-20 政策变更(用户裁决):**GitHub Release 仍只放源码归档,jar 改由商店分发。**
        #    背景:消费方 `astral_dice` 自 2026-10-20 起,`neoforge-1.21.1` / `forge-1.20.1` 两线
        #    **不再用 JarJar 内嵌本库** —— 玩家必须单独安装对应平台 jar;`neoforge-26.1.2` /
        #    `fabric-1.20.1` 两线仍内嵌(待后续批次迁移)。旧政策「请勿单独安装」对前两线已作废。
        #    ⇒ jar 的**唯一分发渠道** = CurseForge(项目 1755415);
        #    ⛔ 2026-10-23 用户裁决:Modrinth 发布链路已**永久移除**(上游不给过审),不要再加回来;
        #    GitHub Release 保持 source-only(避免同一产物出现第二个事实源),并继续**删除任何 jar
        #    附件**(自愈:历史遗留或误传都能被清掉,重复执行幂等)。
        # 发布 Release 的两种来源(均在**同一个 job 内**完成):
        #   ① main 分支 push:用上一步新建/已存在的 tag;
        #   ② ref 本身就是 tag(tag push,或对 tag 手动 workflow_dispatch 补发):直接用 GITHUB_REF 的 tag。
        # ⚠️ 不能依赖「tag push 再触发一次本 workflow」:由 GITHUB_TOKEN 推送的 tag **不会**触发
        # workflow(消费方 astral_dice 踩过同一个坑,故同样改为同 job 内发布)。
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tag.outputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ steps.tag.outputs.tag }}"
          fi
          echo "publishing release for tag: $TAG"
          BUILT="${{ steps.version.outputs.version }}"
          # 说明正文写进临时文件后用 --notes-file 传入(与消费方同一做法)
          NOTES_FILE="$RUNNER_TEMP/starengine-lib-release-notes-$TAG.md"
          {
            printf '## StarEngine %s\n\n' "$TAG"
            printf '构建版本 / build version: `%s`\n\n' "$BUILT"
            printf '> ⚠️ **本仓库不分发 jar —— 此处只有上方 GitHub 自动生成的源码归档。**\n'
            printf '> This repository ships **no jars** — only the automatic source archives above.\n\n'
            printf '**jar 下载请到 CurseForge(项目 `1755415`)。**\n\n'
            printf 'Jars are published on **CurseForge (project `1755415`)**.\n\n'
            printf '本库是 **Astral Dice(星之骰戏)** 的必需前置。**四平台自 2026-11-02 起全部改为独立外部前置、不再内嵌**\n'
            printf '—— 请把与游戏版本/加载器匹配的那个 jar 与模组一起放进 `mods`:\n'
            printf '%s\n' '- `starengine-neoforge-1.21.1-<版本>.jar` / `starengine-forge-1.20.1-<版本>.jar`'
            printf '%s\n' '- `starengine-neoforge-26.1.2-<版本>.jar` / `starengine-fabric-1.20.1-<版本>.jar`'
            printf '\n'
            printf 'StarEngine is required by Astral Dice. **Since 2026-11-02 all four lines use it as a standalone external dependency (no longer embedded)** — install the jar matching your game version and loader next to the mod.\n\n'
            printf '开发者接入(自行 `clone` + `./gradlew publishToMavenLocal`)见 README §4;兼容性契约见 README §6 —— 自 `1.0.0` 起,同一主版本号内不做破坏性更新。\n'
          } > "$NOTES_FILE"
          echo "release notes: $(wc -c < "$NOTES_FILE") bytes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "StarEngine $TAG" --notes-file "$NOTES_FILE"
            # 自愈:清掉该 Release 上一切 jar 附件(历史遗留 / 误传都在此被删)。
            gh release view "$TAG" --json assets -q '.assets[].name' > "$RUNNER_TEMP/assets.txt" || true
            while IFS= read -r name; do
              if [[ -z "$name" ]]; then continue; fi
              case "$name" in
                *.jar)
                  echo "removing jar asset (policy: source only): $name"
                  gh release delete-asset "$TAG" "$name" --yes
                  ;;
                *)
                  echo "keeping non-jar asset: $name"
                  ;;
              esac
            done < "$RUNNER_TEMP/assets.txt"
          else
            # 注意:**不带任何附件** —— Release 因此只含源码归档。
            gh release create "$TAG" \
              --title "StarEngine $TAG" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
      - name: Publish to CurseForge (upload API, runs in CI only)
        # 触发面(刻意收窄,避免重复文件):
        #   ① main 分支 push 且**本次新建了 tag** ⇒ 首发上传;
        #   ② workflow_dispatch + cf_apply=true ⇒ 显式补传/重发;
        #   ③ 其它情况(含 tag push 复用已存在 tag)⇒ 整步跳过 —— 上传 API 无查重,重跑必叠重复。
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tag.outputs.created == '1') || github.event_name == 'workflow_dispatch'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_TOKEN:-}" ]]; then
            echo "::error::CURSEFORGE_TOKEN secret 未配置 —— 库 jar 必须发布到 CurseForge(项目 1755415),拒绝静默跳过。"
            exit 1
          fi
          BASE="${{ steps.version.outputs.base }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "CF_PUBLISH: base=$BASE version=$VERSION event=${{ github.event_name }}"
          JARS=()
          for LINE in neoforge-1.21.1 forge-1.20.1 neoforge-26.1.2 fabric-1.20.1; do
            JAR="$LINE/build/libs/starengine-$LINE-$BASE.jar"
            if [[ ! -f "$JAR" ]]; then
              echo "::error::缺少构建产物 $JAR"
              exit 1
            fi
            JARS+=("--jar" "$JAR")
          done
          # releaseType 由版本号自动派生(-alpha/-beta/-rc/-pre,无后缀=release);库无硬前置 ⇒ 不带 relations。
          # 手动 dispatch 且未勾 cf_apply ⇒ 只做 dry-run:验证接线(secret/产物路径/解析)而不产生重复文件。
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.cf_apply }}" != "true" ]]; then
            echo "CF_DRY_RUN: workflow_dispatch 未勾 cf_apply ⇒ 只规划,不上传"
            python3 tools/curseforge_upload.py push --dry-run "${JARS[@]}"
          else
            python3 tools/curseforge_upload.py push --apply "${JARS[@]}"
          fi
