// StarEngine / NeoForge 1.21.1 平台子项目
// Java 21 · Mojmap + Parchment · ModDevGradle 2.0.141 · 无需 refmap
//
// 源码 = 本子项目 src/main/java(平台专有) + ../../common/src/main/java(共享)
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

// maven 坐标版本:纯 semver,不含 + 构建元数据(文件名后缀由 archivesName 承担)
version = lib_version
group = mod_group_id

base {
    archivesName = 'starengine-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// === 共享源码目录 ===
// common 不是 Gradle 子项目,而是被两个平台各自编译一次的源码目录。
// 因此 common 源码只能使用两版 MC 都存在且签名一致的 API,且不得使用 Java 21 独有语法
// (Java 17 侧也要编译同一份)。
sourceSets.main.java.srcDir(project.file('../common/src/main/java'))

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 本库不注册任何东西,也没有 mixin / AT;runs 留空,库由消费方 mod 的 run 加载。
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // 本库当前不引入任何第三方模组依赖:配置 schema 已回归各消费方自己的
    // ModConfigSpec / ForgeConfigSpec(见 README §3),库内只保留平台无关的
    // GameplayConfigValues 值快照与 GameplayConstants.applyConfig(...)。
    // 共享源码因此不含任何加载器或第三方库字面量,新增依赖前请先确认 common 是否需要它。
}

// 展开 mods.toml 模板中的 ${} 占位符
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 显式坐标:默认 artifactId 会退化为子项目名(neoforge-1.21.1),
            // 与 archivesName 不一致会造成消费方书写困惑,故显式指定。
            artifactId = 'starengine-neoforge-1.21.1'
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 注意:此处**不能**设 options.release = 17。
    // MC 1.21.1 / NeoForge 21.1 的类文件版本为 65(Java 21),--release 17 会因
    // "class file has wrong version 65.0, should be 61.0" 直接编译失败;
    // 且 NeoForge 1.21.1 要求 mod 目标为 Java 21。
    // common 源码「禁用 Java 21 独有语法」是由 forge-1.20.1 侧(Java 17 工具链)编译同一份源码来强制的。
}

// === 编译产物部署（`pushToPack` 已于 2026-09-24 移除）===
// 本库曾是消费方 astral_dice 的**外置**必需前置，故 `build` 会经 `pushToPack` 把库 jar 推进三个
// 整合包的 mods 目录。自消费方改为 **JarJar 内嵌**本库后，整合包里**不应**再出现独立库 jar：
// FML 的 JarInJar 选择器按 **modId** 识别同源件，顶层 mod 列表里若已有同名 mod，内嵌副本会被丢弃
// （独立 jar 版本更旧时反而会**盖掉**内嵌版 ⇒ NoSuchMethodError / NoClassDefFoundError）。
// ⇒ 已移除该任务，连同只服务于它的 `packModsDir` / `packPushBranches` / `forcePackPush` /
//   `dotGitEntry` / `jarArchiveProvider`；`build` 不再读写任何整合包目录。
// ⚠️ 2026-10-01 政策：**本仓不提供任何 jar 下载**（Release 只含源码归档，CI 也不上传构建产物）
// ⇒ 需要独立 jar 做 A/B 时请自行从源码构建（`gradlew build`，产物在 <平台>/build/libs/），
//   **不要**恢复自动推送，也不要试图从本仓下载。

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// === 根目录产物固化（2026-10-21）===
// `build` 结束后把本平台产物复制到仓库根 `build/libs`，并删除同 artifactId 的旧版本 jar。
// 原因：此前根 `build/libs` 全靠人工拷贝，多次落后于子项目产物（2026-10-21 实测旧包 10-20 12:38）。
// ⚠️ 配置缓存约束：Provider 与路径在**配置期**取好，`doLast` 内只做文件操作（不得访问 `tasks`/`copy`）。
tasks.register('pushToRootBuild') {
    group = 'build'
    description = 'Copy this platform jar to <repo>/build/libs and remove older jars of the same artifact.'
    def jarTaskProvider = tasks.named('jar')
    dependsOn jarTaskProvider
    def archiveProvider = jarTaskProvider.flatMap { it.archiveFile }
    def outDir = rootProject.layout.projectDirectory.dir('build/libs').asFile
    def artifactId = base.archivesName.get()
    doLast {
        def archive = archiveProvider.get().asFile
        outDir.mkdirs()
        def stale = (outDir.listFiles() ?: []).findAll {
            it.isFile() && it.name.startsWith(artifactId + '-') && it.name.endsWith('.jar') && it.name != archive.name
        }
        stale.each { it.delete() }
        new File(outDir, archive.name).bytes = archive.bytes
        println("pushToRootBuild: ${archive.name} -> ${outDir}" + (stale ? " (removed ${stale.size()} old)" : ''))
    }
}
tasks.named('build') { finalizedBy 'pushToRootBuild' }
