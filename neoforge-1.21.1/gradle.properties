# ⚠️ 该键由 neoforge.mods.toml 模板写进 **loaderVersion** —— 那是 javafml **语言提供者**的版本槽,
#    比较的是 FML 语言提供者的版本(本机 NeoForge 21.1.235 报 `4.0.42`),**不是** NeoForge 版本带。
#    2026-09-17 实测:这里写成 NeoForge 版本带 `[21.1,21.2)` 会让 FML **拒载整个库 jar** ——
#      `Mod File …\.m2\…\starengine-neoforge-1.21.1-1.0.0-SNAPSHOT.5.jar needs language provider
#       javafml:21.1 or above, and below 21.2 to load / We have found 4.0.42`
#      (两份崩溃报告:`run/1.21.1/crash-reports/crash-2026-09-17_20.41.28-fml.txt` 与
#       `…_20.42.17-fml.txt`,在消费方 `astral_dice_multiloader-next` 工作树内),
#      随后消费方 mod 被连带拒绝:`Mod astral_dice requires starengine 1.0.0-SNAPSHOT.5 or above,
#      and below 2.0 / Currently, starengine is not installed`。
#    ⇒ 与消费方 `astral_dice_multiloader-next/neoforge-1.21.1/gradle.properties:23` **同值 `[1,)`**。
#      NeoForge 版本带 `[21.1,21.2)` 属于模版里 `modId="neoforge"` **依赖**的位置(那里比的是版本),
#      本库该依赖当前就是 `[21.1,21.2)`,不需要也不应该搬到 loaderVersion。
loader_version_range=[1,)

