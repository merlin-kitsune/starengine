#      一处未发布的改动不占用两个版本号 ⇒ 远端仍只有 tag `1.0.0`。
#   ⚠️ **兼容性契约(全局约定,2026-09-22 起生效,三平台一体适用)**:
#     凡**第一位数字不变**的版本(同一主版本号,当前 = 1.x),一律**禁止任何破坏性更新** ——
#     不得删除/改名任何 public 类型、方法、字段、常量,也不得改变其可见性、签名或既有语义;
#     只允许**新增**(新类型/新成员/新可选入口)与不改变契约的行为修正。
