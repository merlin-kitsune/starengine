#      而库自身零调用它(它只是给消费方用的 shim);调用它的消费方自己声明 curios 必需;
#   ③ 纯放宽、不删改任何 public 类型/方法/字段/签名/语义 ⇒ 符合下方 1.x 兼容契约,
#      消费方 `starengine_version_range=[1.0.0,2.0)` 无需改动;
#   ④ 三平台产物文件名保持 `starengine-<平台>-1.0.0.jar`(**不产生 1.0.1**:1.0.1 从未推送、
#      从未发布,远端只有一个 tag `1.0.0`,其 Release 附件随本次 push 重刷)。
#   ⑤ 同日还**为第三条线补齐了一处缺失的平台实现**:neoforge-26.1.2 的 `NeoForgeEconomyStorage`
