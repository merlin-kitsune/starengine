# 2.0.0-SNAPSHOT.2:「骰战数值校准 + 抗性/保护通道复刻」——
#   ① 新增 combat/VanillaMitigation(原版 抗性 + 保护附魔 两条魔法减伤通道的纯算术复刻:
#      resistanceFactor / protectionFactor / magicAbsorbFactor),供消费方在骰战层之后补乘;
#   ② CombatFormula 系数改「抬基数 + 凹斜率」:玩家起始 2→4、玩家护甲系数 0.5→0.30、
#      玩家韧性系数 1.4→0.85、生物护甲系数 0.5→0.40、生物韧性系数 1.125→1.0;
#      ⚠️ 破坏性:删除 public 常量 ARMOR_DIVISOR(「护甲÷2」的统一下数已不再成立),
#      改由 PLAYER_ARMOR_COEF / MOB_ARMOR_COEF 分别表达;
#   ③ TargetBattleStats 初始值下调:生物初始防御 2→0、敌对初始攻击 5→4、中立初始攻击 4→3;
#   ④ DiceBattleResolver 下限新增**相对项**:finalDamage = max(1, 攻击点 × 0.15, 攻击点 − 防御点)
#      (修「高防+低攻档位恒定触底 ⇒ 任何修饰器读数都退化为 0」);新增 3 参重载与
#      RELATIVE_FLOOR_RATIO 常量,原 2 参调用语义向后兼容但**数值会变**。
#   ⚠️ 仍在未发布的 2.0.0 主版本线内 ⇒ 01~04 合并为一版(消费方三线同步改 pin 为 2.0.0-SNAPSHOT.2)。
# 2.0.0-SNAPSHOT.3:「会被激怒的可驯服动物计入敌对目标」—— 自 `main` 线 1.0.5 移植到本快照线
#    (2026-09-27 用户裁决;两条线的该功能内容等价,故本快照线补齐以免 dev 线缺该判定):
#    combat/HostileTargets 的口径由「敌对生物 ∪ 中立生物(宠物除外)」扩展为
#    「… ∪ 会被激怒的可驯服动物(宠物除外)」,新增私有判定 isAngerableTamedMount:
#    可驯服(getOwner()==null 且非已驯服 TamableAnimal)、且当前持有目标(getTarget()!=null)
#    或近期被攻击过(getLastHurtByMob()!=null)的 Mob ⇒ 计入敌对目标。
#    ⚠️ 覆盖原版**羊驼 / 行商羊驼**(会被激怒、可驯服,却没实现 NeutralMob ⇒ 此前在选择器里不可选)。
#    ⚠️ 判据刻意**不用**类名/包名(26.1.2 把 animal/horse/** 改名到 animal/equine/** ⇒ common 源码会编译不过),
#       也不用 Mob#isAggressive()(Panda 覆写它表示「攻击型基因」,Llama 不覆写 ⇒ 语义不可靠)。
#    纯新增一条判定分支、不改动既有分支的语义 ⇒ 消费方无需改代码。
#    ⚠️ 本 pin 只属 multi-dev-next 工作树;`main` 线对应 1.0.5,内容等价。
# 2.0.0-SNAPSHOT.4:纯**工程口径**变更 —— 新增仓库根 AGENTS.md(库侧工程约定入口,含 2026-09-29 用户裁决的
#   「每提交一版」版本递增约定:next 分支每提交一次,lib_version 与 mod_version 的 SNAPSHOT 号 +1,
#   含只动文档/CI 的提交;消费方 multi-dev-next 同规则、各自独立计数)。
#   ⚠️ **无 common/** 源码改动、无 API 变化** ⇒ 消费方无需改代码;但按契约须同步 pin 与 CI ref 到本版本。
lib_version=1.1.0-pre.2
# mod_version 用于 neoforge.mods.toml 中展示(带加载器后缀,与消费方约定一致)
mod_version=1.1.0-pre.2+neoforge_1.21.1

