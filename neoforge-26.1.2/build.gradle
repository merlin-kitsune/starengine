// StarEngine / NeoForge 26.1.2 平台子项目(第三条线,与 1.21.1 / 1.20.1 并存)
// Java 25 · Mojmap(无 Parchment)· ModDevGradle 2.0.147 · 无需 refmap
//
// 源码 = 本子项目 src/main/java(平台专有) + ../../common/src/main/java(共享)
//
// 注:common 源码原本只被 Java 17(forge-1.20.1)与 Java 21(neoforge-1.21.1)各编译一次;
// 本子项目加入后 common 要**同时**通过 26.1.2(Java 25 / NeoForge 26.1.2)编译 ⇒
// common 中使用的 MC API 必须是三个版本都存在且签名一致的子集。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

// maven 坐标版本:纯 semver,不含 + 构建元数据(文件名后缀由 archivesName 承担)
version = lib_version
group = mod_group_id

base {
    archivesName = 'starengine-neoforge-26.1.2'
}

// Minecraft 26.1.2 的 javaVersion = java-runtime-epsilon / majorVersion 25(1.21.1 为 21)
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// === 共享源码目录 ===
sourceSets.main.java.srcDir(project.file('../common/src/main/java'))
// 注:此处曾有一条 `sourceSets.main.java.exclude 'com/merlinkitsune/starengine/event/AstralEventType.java'`
//    —— 26.1 起 net.minecraft.resources.ResourceLocation 已改名为 Identifier,而该 record 的组件类型
//    直接用旧名、Java 又无类型别名可言,故当时只能把该文件排除在 26.1.2 编译之外(三线唯一无法同源者)。
//    该事件框架三件套(AstralEventType / EventContext / EventEffect)已于 1.0.0-SNAPSHOT.5 随合并收尾
//    整体删除(合并后消费方三线零引用),exclude 行随之移除 —— **勿再加回**。

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
}

neoForge {
    version = project.neo_version

    // 无 parchment 块:Parchment 官方 maven 对 26.1.x / 26.2 全部 404,声明它会直接构建失败。
    // 原版写法一律以本版本反编译源码为准:
    //   neoforge-26.1.2/build/moddev/artifacts/neoforge-26.1.2.109-sources.jar

    // 本库不注册任何东西,也没有 mixin / AT;runs 留空,库由消费方 mod 的 run 加载。
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // 本库不引入任何第三方模组依赖(与 neoforge-1.21.1 侧一致:配置已回归消费方 TOML,
    // 库内只保留平台无关的 GameplayConfigValues 值快照 + GameplayConstants.applyConfig(...))。
}

// 展开 mods.toml 模板中的 ${} 占位符
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 显式坐标:默认 artifactId 会退化为子项目名(neoforge-26.1.2)。
            artifactId = 'starengine-neoforge-26.1.2'
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// === 编译产物部署（`pushToPack` 已于 2026-09-24 移除）===
// 本库曾是消费方 astral_dice 的**外置**必需前置，故 `build` 会经 `pushToPack` 把库 jar 推进三个
// 整合包的 mods 目录。自消费方改为 **JarJar 内嵌**本库后，整合包里**不应**再出现独立库 jar：
// FML 的 JarInJar 选择器按 **modId** 识别同源件，顶层 mod 列表里若已有同名 mod，内嵌副本会被丢弃
// （独立 jar 版本更旧时反而会**盖掉**内嵌版 ⇒ NoSuchMethodError / NoClassDefFoundError）。
// ⇒ 已移除该任务，连同只服务于它的 `packModsDir` / `packPushBranches` / `forcePackPush` /
//   `dotGitEntry` / `jarArchiveProvider`；`build` 不再读写任何整合包目录。
// ⚠️ 2026-10-01 政策：**本仓不提供任何 jar 下载**（Release 只含源码归档，CI 也不上传构建产物）
// ⇒ 需要独立 jar 做 A/B 时请自行从源码构建（`gradlew build`，产物在 <平台>/build/libs/），
//   **不要**恢复自动推送，也不要试图从本仓下载。

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
