# (仅到 1.21.x 为止),build.gradle 里不得出现 parchment { ... } 块,故此处也不声明
# parchment_minecraft_version / parchment_mappings_version。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge 版本号 = <MC 版本>.<构建号>;26.1.2 线最新稳定为 26.1.2.109
