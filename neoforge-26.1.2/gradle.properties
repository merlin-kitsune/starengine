# 加载器语言区间仍用 FML 主版本(与 1.21.1 侧同构):该键进模板的 **loaderVersion**(javafml
# 语言提供者版本槽),只能写语言区间 —— 26.1.2 侧本就是 [1,) ,未触发 1.21.1 那次 FML 拒载
# (2026-09-17 两份 crash-*-fml.txt);NeoForge 版本带 [26.1.0.0,26.2) 在模板的 modId="neoforge" 依赖上。
loader_version_range=[1,)

